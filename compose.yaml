name: savethestock

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savethestock}
      POSTGRES_USER: ${POSTGRES_USER:-savethestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savethestock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savethestock} -d ${POSTGRES_DB:-savethestock}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      App__EnableHttpsRedirection: "false"
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-savethestock};Username=${POSTGRES_USER:-savethestock};Password=${POSTGRES_PASSWORD:-savethestock}
      Jwt__Issuer: SaveTheStock
      Jwt__Audience: SaveTheStock
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_DEV_ONLY_MIN_32_CHARS_LONG_123456}
      Jwt__ExpiresMinutes: "60"
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-5173}
      Cors__AllowedOrigins__1: http://frontend:5173
      DevSeed__Enabled: ${DEV_SEED_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/backend
      - dotnet_nuget:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_PORT: "5173"
      VITE_API_BASE_URL: ""
      VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
      VITE_PROXY_TARGET: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  dotnet_nuget:
