
name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

env:
  FRONTEND_IMAGE_NAME: ghcr.io/camfav/savethestock-frontend
  BACKEND_IMAGE_NAME: ghcr.io/camfav/savethestock-backend

jobs:
  build-and-push:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event == 'push'
      }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          SHORT_SHA="${SOURCE_SHA:0:7}"

          {
            echo "frontend_tags<<EOF"
            echo "${FRONTEND_IMAGE_NAME}:sha-${SHORT_SHA}"
            echo "${FRONTEND_IMAGE_NAME}:main"
            echo "${FRONTEND_IMAGE_NAME}:latest"
            echo "EOF"

            echo "backend_tags<<EOF"
            echo "${BACKEND_IMAGE_NAME}:sha-${SHORT_SHA}"
            echo "${BACKEND_IMAGE_NAME}:main"
            echo "${BACKEND_IMAGE_NAME}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_API_TIMEOUT_MS=15000

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.tags.outputs.backend_tags }}
