name: savethestock

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savethestock}
      POSTGRES_USER: ${POSTGRES_USER:-savethestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savethestock} -d ${POSTGRES_DB:-savethestock}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/example/savethestock-backend:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      App__EnableHttpsRedirection: "false"
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-savethestock};Username=${POSTGRES_USER:-savethestock};Password=${POSTGRES_PASSWORD:-change-me}
      Jwt__Issuer: SaveTheStock
      Jwt__Audience: SaveTheStock
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_PRODUCTION_SECRET_MIN_32_CHARS}
      Jwt__ExpiresMinutes: "60"
      Cors__AllowedOrigins__0: ${APP_ORIGIN:-http://localhost}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/example/savethestock-frontend:latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
